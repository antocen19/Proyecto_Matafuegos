<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Matafuegos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-xl border-t-8 border-red-600">
        
        <!-- Encabezado -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Control de Inspección</h1>
            <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mt-1">E.T. N° 35 "Ing. E. Latzina"</h2>
        </div>

        <!-- Indicador de estado de la base de datos -->
        <div id="estado-conexion" class="mb-6 flex items-center justify-center gap-2 text-xs font-medium text-gray-500 bg-gray-50 py-2 rounded-lg">
            <span class="inline-block w-2.5 h-2.5 bg-yellow-400 rounded-full animate-pulse" id="dot-conexion"></span>
            <span id="texto-conexion">Sincronizando con Google Sheets...</span>
            <button onclick="cargarDatos()" class="ml-2 text-blue-500 hover:text-blue-700" title="Actualizar base de datos">🔄</button>
        </div>

        <!-- Buscador de Serie -->
        <form id="form-busqueda" class="mb-6">
            <label class="block text-sm font-bold text-gray-700 mb-2 text-center">Ingrese el Nº de Serie o Interno:</label>
            <div class="flex flex-col gap-3">
                <input type="text" id="input-serie" required 
                       class="w-full border-2 border-gray-300 rounded-xl p-4 text-center text-xl font-bold tracking-widest uppercase focus:ring-red-500 focus:border-red-500 shadow-inner" 
                       placeholder="EJ: 81174" autocomplete="off">
                <button type="submit" id="btn-buscar" disabled
                        class="w-full bg-red-600 text-white font-bold py-3 px-4 rounded-xl hover:bg-red-700 transition duration-300 shadow-md disabled:bg-gray-400 disabled:cursor-not-allowed text-lg">
                    Verificar Estado
                </button>
            </div>
        </form>

        <!-- Tarjeta de Resultado (Oculta por defecto) -->
        <div id="resultado-container" class="hidden flex-col items-center p-5 rounded-xl border-2 border-dashed border-gray-300 bg-gray-50">
            
            <!-- Badge de Estado -->
            <div id="badge-estado" class="px-6 py-2 rounded-full text-lg font-black uppercase mb-4 text-center w-full shadow-sm">
                <!-- Se llena con JS -->
            </div>

            <!-- Detalles del Equipo -->
            <div id="detalles-equipo" class="w-full space-y-2 text-sm text-gray-700">
                <div class="flex justify-between border-b pb-1">
                    <span class="font-semibold">Tipo:</span>
                    <span id="res-tipo" class="font-medium">-</span>
                </div>
                <div class="flex justify-between border-b pb-1">
                    <span class="font-semibold">Ubicación:</span>
                    <span id="res-ubicacion" class="font-medium text-right">-</span>
                </div>
                <div class="flex justify-between border-b pb-1">
                    <span class="font-semibold">Vencimiento:</span>
                    <span id="res-vencimiento" class="font-medium">-</span>
                </div>
            </div>
            
            <button type="button" onclick="limpiarBusqueda()" class="mt-5 text-gray-500 text-sm font-semibold hover:text-gray-800 underline">
                Realizar otra consulta
            </button>
        </div>

    </div>

    <!-- LÓGICA JAVASCRIPT -->
    <script>
        const URL_API = "https://script.google.com/macros/s/AKfycbyyFC6cXxtdSgEbnSxD8ExuWBW1391vLS7xZ1cO67SUX01UEleZZHJaU4pYQU2IOFE2/exec";
        
        let baseDatos = [];
        const btnBuscar = document.getElementById('btn-buscar');
        const inputSerie = document.getElementById('input-serie');
        const resultadoContainer = document.getElementById('resultado-container');
        const formBusqueda = document.getElementById('form-busqueda');

        // Función para descargar los datos de tu Google Sheets al abrir la app
        async function cargarDatos() {
            setEstadoCarga(true, "Descargando base de datos...");
            btnBuscar.disabled = true;
            
            try {
                const respuesta = await fetch(URL_API);
                const datos = await respuesta.json();
                
                if (Array.isArray(datos)) {
                    baseDatos = datos;
                    setEstadoCarga(false, `Base de datos lista (${baseDatos.length} equipos)`);
                    btnBuscar.disabled = false;
                } else {
                    throw new Error("Formato incorrecto");
                }
            } catch (error) {
                console.error("Error:", error);
                setEstadoError("Error de conexión. Revisar permisos de Sheets.");
            }
        }

        // Lógica al enviar el formulario (Click en Verificar)
        formBusqueda.addEventListener('submit', function(evento) {
            evento.preventDefault();
            const serieBuscada = inputSerie.value.trim().toLowerCase();
            
            // Buscar el equipo en los datos descargados
            const equipoEncontrado = baseDatos.find(
                matafuego => String(matafuego.serie).toLowerCase() === serieBuscada
            );

            mostrarResultado(equipoEncontrado);
        });

        // Mostrar la tarjeta visual con los colores correspondientes
        function mostrarResultado(equipo) {
            resultadoContainer.classList.remove('hidden');
            resultadoContainer.classList.add('flex');
            
            const badgeEstado = document.getElementById('badge-estado');
            
            if (!equipo) {
                // Si no existe el número en el Excel
                badgeEstado.className = "px-6 py-2 rounded-full text-lg font-black uppercase mb-4 text-center w-full shadow-sm bg-gray-200 text-gray-700";
                badgeEstado.innerText = "NO ENCONTRADO";
                
                document.getElementById('res-tipo').innerText = "-";
                document.getElementById('res-ubicacion').innerText = "Verifique el número ingresado";
                document.getElementById('res-vencimiento').innerText = "-";
                return;
            }

            // Si se encuentra, cargar datos
            document.getElementById('res-tipo').innerText = equipo.tipo || "Sin dato";
            document.getElementById('res-ubicacion').innerText = equipo.ubicacion || "Sin ubicación";

            // Calcular vencimiento
            if (equipo.vencimiento) {
                const hoy = new Date();
                const partesFecha = String(equipo.vencimiento).split('-');
                
                if (partesFecha.length >= 2) {
                    const anio = parseInt(partesFecha[0]);
                    const mes = parseInt(partesFecha[1]);
                    const fechaVenc = new Date(anio, mes, 0, 23, 59, 59); // Último día de ese mes
                    
                    const diferenciaMilisegundos = fechaVenc - hoy;
                    const diasRestantes = Math.ceil(diferenciaMilisegundos / (1000 * 60 * 60 * 24));
                    
                    document.getElementById('res-vencimiento').innerText = `${mes.toString().padStart(2, '0')}/${anio}`;

                    // Lógica de colores semáforo
                    if (diasRestantes < 0) {
                        badgeEstado.className = "px-6 py-3 rounded-xl text-xl font-black uppercase mb-4 text-center w-full shadow border-2 bg-red-100 text-red-800 border-red-500 animate-pulse";
                        badgeEstado.innerText = "⚠️ VENCIDO";
                    } else if (diasRestantes <= 30) {
                        badgeEstado.className = "px-6 py-3 rounded-xl text-xl font-black uppercase mb-4 text-center w-full shadow border-2 bg-yellow-100 text-yellow-800 border-yellow-500";
                        badgeEstado.innerText = "⏳ POR VENCER";
                    } else {
                        badgeEstado.className = "px-6 py-3 rounded-xl text-xl font-black uppercase mb-4 text-center w-full shadow border-2 bg-green-100 text-green-800 border-green-500";
                        badgeEstado.innerText = "✅ EN CONDICIONES";
                    }
                } else {
                    marcarFormatoInvalido(badgeEstado);
                }
            } else {
                marcarFormatoInvalido(badgeEstado);
            }
        }

        function marcarFormatoInvalido(badge) {
            badge.className = "px-6 py-2 rounded-full text-lg font-black uppercase mb-4 text-center w-full shadow-sm bg-gray-200 text-gray-600";
            badge.innerText = "SIN FECHA";
            document.getElementById('res-vencimiento').innerText = "Dato faltante en Sheets";
        }

        function limpiarBusqueda() {
            inputSerie.value = '';
            resultadoContainer.classList.remove('flex');
            resultadoContainer.classList.add('hidden');
            inputSerie.focus();
        }

        // Utilidades de la interfaz
        function setEstadoCarga(cargando, mensaje) {
            const dot = document.getElementById('dot-conexion');
            document.getElementById('texto-conexion').innerText = mensaje;
            if (cargando) {
                dot.className = "inline-block w-2.5 h-2.5 bg-yellow-400 rounded-full animate-pulse";
            } else {
                dot.className = "inline-block w-2.5 h-2.5 bg-green-500 rounded-full";
            }
        }

        function setEstadoError(mensaje) {
            document.getElementById('texto-conexion').innerText = mensaje;
            document.getElementById('dot-conexion').className = "inline-block w-2.5 h-2.5 bg-red-500 rounded-full";
        }

        // Cargar datos al iniciar
        cargarDatos();
    </script>
</body>
</html>
